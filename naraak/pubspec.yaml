name: naraak
description: Naraak - Bahrain PHC unified services app
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/naraak_logo.png
    - assets/images/family_doctor_card.jpeg
    - assets/images/splash.jpg
    - assets/images/service_mammogram.jpg
    - assets/images/service_vaccination.jpg
    - assets/images/service_booking.jpg
    - assets/images/service_medical_reports.jpg
    - assets/images/Electronic Hajj certificate.jpeg
    - assets/images/Sehati Card request for newborn.png
    - assets/images/Medical reports and certificates..png
    - assets/images/Request mobile unit service.jpg
    - assets/images/Primary healthcare research applications.jpg
    - assets/images/Health fee exemption card issuance.jpg
    - assets/images/Update residential address.jpg
    - assets/images/dashboard_phc_hero.png
    - assets/images/Primary Healthcare Centers.jpg
    - assets/images/naraak_app_promo.png
    - assets/documents/
  # Fonts are no longer bundled as local assets — google_fonts (added above)
  # fetches Noto Sans / Noto Sans Arabic from Google's CDN at runtime and
  # caches them on-device. See lib/theme/app_text_styles.dart.
